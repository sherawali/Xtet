name: question-bank-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned source-schema validator
        run: python -m pip install -r requirements.txt
      - name: Validate vendored UTET schemas and records
        run: python -m pipeline validate-sources
      - name: Run parser, SQLite, determinism, and query tests
        run: python -m unittest discover -s tests -v
      - name: Build a clean CI database and quality report
        run: python -m pipeline build --stage build/ci-stage.json --db build/ci-question-bank.sqlite --report build/ci-DATA_QUALITY.md
      - name: Independently verify clean CI database
        run: python -m pipeline verify --db build/ci-question-bank.sqlite
